    <style>

.box {
    position: relative;
    width: fit-content;
    margin: 100px auto 0;
    animation: popUp 0.6s ease;
}

h1 {
    margin: 0;
    text-align: center;
    color: #607d8d;
    font-size: 100px;

    text-shadow:
        0 0 5px #2f2f2f,
        0 0 10px #2f2f2f,
        0 0 20px #2f2f2f,
        0 0 40px #2f2f2f;
}


.doodle {
    position: absolute;

    width: 150px;

    
    right: -120px;
    top: -20px;

   
    transform: rotate(8deg);

    animation: doodlePop 0.6s ease;
}

@keyframes popUp {
    0% {
        transform: translateY(50px) scale(0.5);
        opacity: 0;
    }

    80% {
        transform: translateY(-5px) scale(1.05);
        opacity: 1;
    }

    100% {
        transform: translateY(0) scale(1);
    }
}


@keyframes doodlePop {
    0% {
        transform: scale(0) rotate(-15deg);
        opacity: 0;
    }

    70% {
        transform: scale(1.15) rotate(10deg);
        opacity: 1;
    }

    100% {
        transform: scale(1) rotate(8deg);
        opacity: 1;
    }
}

.floating-text { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; } .floating-text span {
     position: absolute; color: #5F7A99; opacity: 0.15; font-size: 30px; font-weight: bold; animation: floatAround 6s ease-in-out infinite; } 
     /* TOP LEFT */ .floating-text span:nth-child(1) 
     { top: 8%; left: 7%; font-size: 28px; } /* TOP RIGHT */ .floating-text span:nth-child(2) { top: 12%; right: 8%; font-size: 50px; } /* LEFT SIDE */ .floating-text span:nth-child(3) { top: 38%; left: 5%; font-size: 35px; } /* RIGHT SIDE */ .floating-text span:nth-child(4) 
     { top: 32%; right: 6%; font-size: 45px; } /* FAR TOP CENTER */ .floating-text span:nth-child(5) { top: 5%; left: 45%; font-size: 25px; } /* BOTTOM RIGHT */ .floating-text span:nth-child(6) { bottom: 8%; right: 7%; font-size: 50px; } /* FAR LEFT BOTTOM */ .floating-text span:nth-child(7) { bottom: 12%; left: 6%; font-size: 27px; } 
     /* UPPER-MIDDLE LEFT */ .floating-text span:nth-child(8) { top: 22%; left: 25%; font-size: 45px; } /* LOWER-MIDDLE RIGHT */ .floating-text span:nth-child(9) { bottom: 25%; right: 25%; font-size: 32px; } /* FAR BOTTOM CENTER */ .floating-text span:nth-child(10) { bottom: 5%; left: 45%; font-size: 45px; } /* MIDDLE LEFT */ .floating-text span:nth-child(11) { top: 65%; left: 20%; font-size: 25px; } /* MIDDLE RIGHT */ .floating-text span:nth-child(12) { top: 70%; right: 18%; font-size: 45px; } /* FLOATING ANIMATION */ @keyframes floatAround { 0% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-25px) rotate(5deg); } 100% { transform: translateY(0) rotate(-5deg); } } /* Make them move at different speeds */ .floating-text span:nth-child(1) { animation-duration: 5s; } .floating-text span:nth-child(2) { animation-duration: 7s; } .floating-text span:nth-child(3) { animation-duration: 6s; } .floating-text span:nth-child(4) { animation-duration: 8s; } .floating-text span:nth-child(5) { animation-duration: 5.5s; } .floating-text span:nth-child(6) { animation-duration: 7.5s; } .floating-text span:nth-child(7) { animation-duration: 6.5s; } .floating-text span:nth-child(8) { animation-duration: 8s; } .floating-text span:nth-child(9) { animation-duration: 5s; } .floating-text span:nth-child(10) { animation-duration: 7s; } .floating-text span:nth-child(11) { animation-duration: 6s; } .floating-text span:nth-child(12) { animation-duration: 8.5s; } /* Keep your main birthday title above them */ .box { position: relative; z-index: 2; }

 .confetti {
    position: fixed;
    top: -10px;
    width: 10px;
    height: 18px;
    border-radius: 2px;
    z-index: 9999;
    animation: fall 3s linear forwards;
}

@keyframes fall {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }

    100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}
     
.balloon {
    position: fixed;
    bottom: -80px;
    width: 45px;
    height: 55px;
    border-radius: 50%;
    z-index: 9998;
    animation: balloonFloat 6s ease-in forwards;
}

.balloon::after {
    content: "";
    position: absolute;
    width: 2px;
    height: 50px;
    background: #333;
    top: 52px;
    left: 50%;
}

@keyframes balloonFloat {
    0% {
        transform: translateY(0) rotate(-5deg);
        opacity: 1;
    }

    50% {
        transform: translateY(-50vh) rotate(5deg);
    }

    100% {
        transform: translateY(-120vh) rotate(-5deg);
        opacity: 0;
    }
}
    </style>

    <script>
function party() {
    for (let i = 0; i < 80; i++) {
        const confetti = document.createElement("span");

        confetti.classList.add("confetti");

        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.animationDelay = Math.random() * 0.5 + "s";
        confetti.style.backgroundColor = getRandomColor();

        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.remove();
        }, 3000);
    }
}

function getRandomColor() {
    const colors = [
        "#17324D",
        "#5F8FA6",
        "#F4A340",
        "#7FC8A9",
        "#FFD078"
    ];

    return colors[Math.floor(Math.random() * colors.length)];
}

for (let i = 0; i < 15; i++) {
    const balloon = document.createElement("span");

    balloon.classList.add("balloon");

    balloon.style.left = Math.random() * 100 + "vw";
    balloon.style.animationDelay = Math.random() * 2 + "s";
    balloon.style.backgroundColor = getRandomColor();

    document.body.appendChild(balloon);

    setTimeout(() => {
        balloon.remove();
    }, 6000);
}
</script>
